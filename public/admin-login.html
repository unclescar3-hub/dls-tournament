<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unclescar Studios — Operations Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050810;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    /* animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,230,118,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,230,118,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(ellipse, rgba(0,230,118,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .portal-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 24px;
      background: rgba(10, 15, 26, 0.96);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 18px;
      padding: 48px 40px 40px;
      box-shadow: 0 0 0 1px rgba(0,230,118,.06), 0 40px 80px rgba(0,0,0,.8), 0 0 60px rgba(0,230,118,.06);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, rgba(0,230,118,.15) 0%, rgba(0,230,118,.05) 100%);
      border: 1.5px solid rgba(0,230,118,.35);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .logo-text {
      font-family: 'Rajdhani', 'Impact', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #f0f4ff;
      text-transform: uppercase;
    }

    .logo-text span { color: #00e676; }

    .portal-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(0,230,118,.6);
      background: rgba(0,230,118,.06);
      border: 1px solid rgba(0,230,118,.15);
      padding: 4px 12px;
      border-radius: 20px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #f0f4ff;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    .subtitle {
      font-size: .82rem;
      color: rgba(160,175,210,.55);
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(160,175,210,.5);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: .4;
      pointer-events: none;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 13px 14px 13px 42px;
      color: #f0f4ff;
      font-size: .92rem;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      font-family: inherit;
    }

    input:focus {
      border-color: rgba(0,230,118,.5);
      box-shadow: 0 0 0 3px rgba(0,230,118,.08);
      background: rgba(255,255,255,.06);
    }

    input::placeholder { color: rgba(160,175,210,.3); }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: #00e676;
      color: #020a05;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { opacity: .9; }
    .btn-login:active { transform: scale(.99); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }

    .error-box {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(255, 26, 94, .08);
      border: 1px solid rgba(255, 26, 94, .3);
      border-radius: 8px;
      color: #ff4d7d;
      font-size: .83rem;
      text-align: center;
    }

    .lockout-box {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(255,193,7,.07);
      border: 1px solid rgba(255,193,7,.3);
      border-radius: 8px;
      color: #ffc107;
      font-size: .82rem;
      text-align: center;
    }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-size: .72rem;
      color: rgba(160,175,210,.25);
      letter-spacing: .5px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      margin: 28px 0;
    }
  </style>
</head>
<body>
<div class="portal-card">
  <div class="logo-area">
    <div class="logo-icon">🏆</div>
    <div class="logo-text">UNCLESCAR <span>STUDIOS</span></div>
    <div class="portal-badge">Operations Portal</div>
  </div>

  <div class="divider"></div>

  <h1>Login To Your Account</h1>
  <p class="subtitle">Authorized personnel only. All access is logged.</p>

  <form id="login-form" autocomplete="on">
    <div class="field">
      <label>Username</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f0f4ff" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="Your admin username" required autocomplete="username" autofocus>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f0f4ff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••••" required autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <span id="btn-text">LOGIN</span>
      <svg id="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </form>

  <div id="error-box" class="error-box"></div>
  <div id="lockout-box" class="lockout-box">⚠ Too many failed attempts. Please wait 15 minutes before trying again.</div>

  <p class="footer-note">Unclescar Studios &copy; 2026 &nbsp;·&nbsp; Restricted Access</p>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const errBox = document.getElementById('error-box');
    const lockBox = document.getElementById('lockout-box');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    errBox.style.display = 'none';
    lockBox.style.display = 'none';
    btn.disabled = true;
    btnText.textContent = 'VERIFYING...';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        credentials: 'include'
      });

      const data = await res.json();

      if (res.status === 429) {
        lockBox.style.display = 'block';
        return;
      }

      if (!res.ok) {
        errBox.textContent = data.error || 'Invalid credentials. Please try again.';
        errBox.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
        return;
      }

      // Success — go to dashboard
      btnText.textContent = 'ACCESS GRANTED ✓';
      btn.style.background = '#00e676';
      setTimeout(() => {
        window.location.href = window.location.pathname + '/dashboard';
      }, 400);

    } catch (err) {
      errBox.textContent = 'Connection error. Please try again.';
      errBox.style.display = 'block';
    } finally {
      if (btnText.textContent !== 'ACCESS GRANTED ✓') {
        btn.disabled = false;
        btnText.textContent = 'LOGIN';
      }
    }
  });
</script>
</body>
</html>
